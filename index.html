<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudora</title>
    
    <!-- CSS File Link -->
    <link rel="stylesheet" href="index.css">
    
    <!-- App Logo Links -->
    <link rel="icon" type="image/png" href="https://icons8.com">
    <link rel="apple-touch-icon" href="https://icons8.com">
</head>
<body>

    <div class="weather-card">
        <div class="search-box">
            <input type="text" id="city-input" placeholder="Enter city (e.g., Gilgit, Karachi)..." autocomplete="off">
            <button id="search-btn">Search</button>
        </div>
        
        <!-- Weather Response Area -->
        <div class="weather-info" id="weather-info" style="display: none;">
            <h2 id="city-name">--</h2>
            <p id="weather-desc">--</p>
            <h1 id="temperature">--°C</h1>
            
            <div class="details-grid">
                <div class="detail-item">
                    <span class="label">Humidity</span>
                    <span class="value" id="humidity">--%</span>
                </div>
                <div class="detail-item">
                    <span class="label">Wind Speed</span>
                    <span class="value" id="wind-speed">-- km/h</span>
                </div>
            </div>
        </div>

        <div class="error-msg" id="error-msg" style="display: none;">
            Location not found. Please try again!
        </div>

        <!-- Maryam Credits Section -->
        <div class="credits">
            Created by Maryam ✨
        </div>
    </div>

    <!-- JavaScript File Link -->
    <script src="index.js"></script>
</body>
</html>
